<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Ops Hub</title>
  <desc id="desc">个人工作总台封面，不含内网地址。</desc>
  <rect width="1200" height="675" fill="#09090b"/>
  <rect x="36" y="28" width="1128" height="64" rx="16" fill="#18181b" stroke="#27272a"/>
  <rect x="56" y="42" width="36" height="36" rx="10" fill="#4f46e5"/>
  <rect x="66" y="52" width="16" height="16" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="108" y="66" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">OPS-HUB</text>
  <text x="230" y="66" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">个人数字化运营工作总台</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="36" y="116" width="360" height="150" rx="18" fill="#18181b" stroke="#27272a"/>
    <text x="58" y="150" fill="#a1a1aa" font-size="14">求职投递</text>
    <text x="58" y="198" fill="#fafafa" font-size="42" font-weight="750">29</text>
    <text x="128" y="198" fill="#a1a1aa" font-size="16">条在跟</text>
    <text x="58" y="232" fill="#a5b4fc" font-size="14">准备中 · 已投递 · 初筛 · 已录用</text>
    <rect x="416" y="116" width="360" height="150" rx="18" fill="#18181b" stroke="#3f3f46"/>
    <text x="438" y="150" fill="#fcd34d" font-size="14">教资初试</text>
    <text x="438" y="198" fill="#fde68a" font-size="36" font-weight="750">等成绩</text>
    <text x="438" y="232" fill="#a1a1aa" font-size="14">笔试已结束，等待初试成绩</text>
    <rect x="796" y="116" width="368" height="150" rx="18" fill="#18181b" stroke="#27272a"/>
    <text x="818" y="150" fill="#a1a1aa" font-size="14">三端设备</text>
    <text x="818" y="198" fill="#fafafa" font-size="28" font-weight="700">Mac · Windows · Jetson</text>
    <text x="818" y="232" fill="#a1a1aa" font-size="14">状态在总台里看，地址不写在封面上</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="36" y="290" width="1128" height="78" rx="16" fill="#111113" stroke="#27272a"/>
    <text x="58" y="324" fill="#e4e4e7" font-size="18" font-weight="650">同一套系统</text>
    <text x="58" y="350" fill="#a1a1aa" font-size="15">软著名称是「异构多端算力协同与数字化运维工作总台系统」。作品集里的两张卡片打开的是同一个页面。</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="36" y="390" width="360" height="230" rx="16" fill="#18181b" stroke="#27272a"/>
    <text x="58" y="428" fill="#fafafa" font-size="16" font-weight="650">求职</text>
    <text x="58" y="468" fill="#d4d4d8" font-size="15">来自 Career-Copilot 台账</text>
    <text x="58" y="508" fill="#a1a1aa" font-size="14">公开页只显示公司、岗位和阶段</text>
    <text x="58" y="548" fill="#a5b4fc" font-size="14">备注和简历文件名不放出来</text>
    <rect x="416" y="390" width="360" height="230" rx="16" fill="#18181b" stroke="#27272a"/>
    <text x="438" y="428" fill="#fafafa" font-size="16" font-weight="650">考试</text>
    <text x="438" y="468" fill="#d4d4d8" font-size="15">教资：等初试成绩</text>
    <text x="438" y="508" fill="#a1a1aa" font-size="14">六级仍按考试日倒计时</text>
    <text x="438" y="548" fill="#a1a1aa" font-size="14">减肥计划已结束，不再显示</text>
    <rect x="796" y="390" width="368" height="230" rx="16" fill="#18181b" stroke="#27272a"/>
    <text x="818" y="428" fill="#fafafa" font-size="16" font-weight="650">设备</text>
    <text x="818" y="468" fill="#d4d4d8" font-size="15">Mac 管日常</text>
    <text x="818" y="508" fill="#d4d4d8" font-size="15">Windows 做计算</text>
    <text x="818" y="548" fill="#d4d4d8" font-size="15">Jetson 做端侧</text>
  </g>
</svg>
