<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">个人财务复盘看板工程示意</title><desc id="desc">Markdown 复盘通过 Python 规则解析与金额校验生成 JSON，供静态看板展示周月年视图。非界面截图，不含真实账务。</desc>
  <style>:root{--bg:#eaf4f2;--panel:#fff;--line:#c5dfd8;--ink:#214c44;--muted:#51796f;--accent:#167664} @media(prefers-color-scheme:dark){:root{--bg:#172e2a;--panel:#203d36;--line:#335c50;--ink:#dff4ed;--muted:#a4cbbd;--accent:#83d9bd}} text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink)} .muted{fill:var(--muted)} .accent{fill:var(--accent)} .box{fill:var(--panel);stroke:var(--line);stroke-width:2}</style>
