<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">电商中台与供应链数据流工程示意</title><desc id="desc">多渠道订单、商品主数据同步与对账核销的流程概览，不包含真实订单或业务数据。</desc>
  <style>:root{--bg:#f7f1e7;--panel:#fff;--line:#e3d4bb;--ink:#5a4426;--muted:#806b4b;--accent:#956415} @media(prefers-color-scheme:dark){:root{--bg:#2e281f;--panel:#3b3225;--line:#5e4e34;--ink:#f4ead7;--muted:#ccbb9c;--accent:#e2bc77}} text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink)} .muted{fill:var(--muted)} .accent{fill:var(--accent)} .box{fill:var(--panel);stroke:var(--line);stroke-width:2}</style>
  <rect width="960" height="540" rx="20" fill="var(--bg)"/>
  <path d="M712 0v540M832 0v540M0 180h960M0 420h960" stroke="var(--line)" opacity=".35"/>
  <text x="48" y="63" font-size="17" letter-spacing="3" class="accent">COMMERCE / DATA PIPELINE</text>
  <text x="48" y="124" font-size="42" font-weight="650">把分散业务，接成数据链路</text>
  <text x="48" y="162" font-size="20" class="muted">多渠道订单 · 商品数据 · 库存同步</text>
  <g><rect class="box" x="48" y="212" width="252" height="182" rx="18"/><rect class="box" x="354" y="212" width="252" height="182" rx="18"/><rect class="box" x="660" y="212" width="252" height="182" rx="18"/></g>
  <path d="M312 303h28m-8-8 8 8-8 8M618 303h28m-8-8 8 8-8 8" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <g font-size="19"><text x="72" y="252" class="accent">01 / 汇集</text><text x="378" y="252" class="accent">02 / 同步</text><text x="684" y="252" class="accent">03 / 核对</text></g>
  <g font-size="29" font-weight="600"><text x="72" y="306">订单归集</text><text x="378" y="306">商品中台</text><text x="684" y="306">对账核销</text></g>
  <g font-size="18"><text x="72" y="352" class="muted">渠道接入 / 数据抽取</text><text x="378" y="352" class="muted">主数据 / 库存同步</text><text x="684" y="352" class="muted">失败重试 / 幂等校验</text></g>
  <text x="48" y="461" font-size="20" font-weight="500">只展示工程结构，不使用真实订单与客户资料</text>
  <text x="48" y="501" font-size="16" class="muted">工程示意 · 非界面截图</text><text x="912" y="501" text-anchor="end" font-size="16" class="muted">LEO / INDUSTRY 04</text>
</svg>
