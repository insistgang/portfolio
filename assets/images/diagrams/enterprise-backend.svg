<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">政企业务与 AI 应用集成工程示意</title><desc id="desc">业务场景、后端服务与 AI 应用的职责概览，非界面截图，不包含内部业务数据。</desc>
  <style>:root{--bg:#edf3f8;--panel:#fff;--line:#cbdce8;--ink:#213e55;--muted:#536c80;--accent:#236995} @media(prefers-color-scheme:dark){:root{--bg:#182536;--panel:#203247;--line:#35506a;--ink:#e1edf7;--muted:#a4bdd2;--accent:#83c5ef}} text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--ink)} .muted{fill:var(--muted)} .accent{fill:var(--accent)} .box{fill:var(--panel);stroke:var(--line);stroke-width:2}</style>
  <rect width="960" height="540" rx="20" fill="var(--bg)"/>
  <path d="M712 0v540M832 0v540M0 180h960M0 420h960" stroke="var(--line)" opacity=".35"/>
